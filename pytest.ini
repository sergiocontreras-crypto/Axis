[pytest]
# Restringe la recolección a archivos de prueba Python (test_*.py / *_test.py).
# Evita que artefactos de verificación no-Python en tests/ (p.ej. *.txt, *.log,
# *.xml de corridas) rompan la fase de recolección de pytest.
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = tests
# No descender a artefactos ni cachés al recolectar.
norecursedirs = .git __pycache__ fixtures .hypothesis *.egg .* build dist
